[tools]
go = "1.27.3"
actionlint = "1.7.12"

[tasks.compile]
description = "Compile all native plugin packages (requires a C compiler)"
run = "go build ./..."

[tasks.test]
description = "Run all deterministic plugin and release-task tests"
run = ["go test ./...", "python3 -B -m unittest discover -s tests -p '*_test.py'"]

[tasks.check]
description = "Check formatting, vet, workflow syntax and whitespace"
run = ['test -z "$(gofmt -l .)"', "go vet ./...", "actionlint", "git diff --check"]

[tasks.race]
description = "Repeat randomized race tests for all plugin packages"
run = "go test -race -count=2 -shuffle=on ./..."

[tasks.vuln]
description = "Check reachable vulnerabilities in release plugin sources"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./commandcode ./chatgpt-backend ./embeddings-forward"

[tasks.package]
description = "Package clean source: VERSION required, ARCH=amd64 or arm64, CC for cross builds"
alias = "build"
run = "python3 -B tools/release.py package"

[tasks.smoke]
description = "Qualify existing ZIPs with HOST_CGO/HOST_PUREGO; no rebuild or live provider calls"
run = "python3 -B tools/release.py smoke"

[tasks."smoke:live"]
description = "Opt-in live Command Code qualification; explicit archive and checksum required"
run = 'python3 tests/commandcode_live.py --phase "${LIVE_PHASE:-all}" --host "${HOST_CGO:?}" --archive "${COMMANDCODE_ARCHIVE:?}" --sha256 "${COMMANDCODE_SHA256:?}"'

[tasks."release:publish"]
description = "Rerun gates and publish both Linux targets; VERSION and HOST_DIR required"
confirm = { message = "Publish the clean plugin commit as a plugin-only prerelease?", default = "no" }
run = "python3 -B tools/release.py publish"
